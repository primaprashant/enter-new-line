<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnterNewLine</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__masthead">
        <span class="popup__wordmark">EnterNewLine</span>
        <span id="state-dot" class="state-dot state-dot--inactive" aria-hidden="true"></span>
        <span id="state-label" class="sr-only" aria-live="polite">Inactive</span>
      </header>

      <section class="popup__site">
        <div class="popup__site-copy">
          <span class="popup__eyebrow">On this site</span>
          <span id="site-domain" class="popup__domain">—</span>
          <span id="site-status" class="popup__status" aria-live="polite">Checking…</span>
        </div>
        <button
          id="site-toggle"
          class="toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Toggle extension on this site"
          disabled
        >
          <span class="toggle__thumb" aria-hidden="true"></span>
        </button>
      </section>

      <section class="popup__stats" aria-label="Usage">
        <span class="popup__eyebrow">Activity</span>

        <div class="metric">
          <span class="metric__label">
            New lines added with <span class="kbd">Enter</span>
          </span>
          <div class="metric__row">
            <div class="metric__cell">
              <span id="site-newlines" class="stat__value">0</span>
              <span class="metric__scope">this site</span>
            </div>
            <div class="metric__cell">
              <span id="global-newlines" class="stat__value">0</span>
              <span class="metric__scope">all sites</span>
            </div>
          </div>
        </div>

        <div class="metric">
          <span class="metric__label">
            Messages sent with <span id="send-key" class="kbd">Cmd + Enter</span>
          </span>
          <div class="metric__row">
            <div class="metric__cell">
              <span id="site-sends" class="stat__value">0</span>
              <span class="metric__scope">this site</span>
            </div>
            <div class="metric__cell">
              <span id="global-sends" class="stat__value">0</span>
              <span class="metric__scope">all sites</span>
            </div>
          </div>
        </div>
      </section>

      <footer class="popup__footer">
        <button id="open-settings" class="btn btn--ghost btn--compact" type="button">
          All settings →
        </button>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
